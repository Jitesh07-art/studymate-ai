{% extends 'base.html' %}{% block title %}Study History{% endblock %}{% block content %}
<section class="page-intro history-intro"><div><div class="eyebrow"><span class="eyebrow-dot"></span> YOUR LIBRARY</div><h1>Study <span>history</span></h1><p class="page-subtitle">Everything you have created, all in one place.</p></div><label class="search-box"><span>⌕</span><input id="history-search" type="search" placeholder="Search your library..." aria-label="Search your history"></label></section>
<section class="history-toolbar"><div class="filter-chips" id="history-filters"><button class="filter-chip active" data-filter="all">All items</button><button class="filter-chip" data-filter="summary">Summaries</button><button class="filter-chip" data-filter="quiz">Quizzes</button><button class="filter-chip" data-filter="flashcards">Flashcards</button></div><span id="history-count" class="history-count"></span></section>
<section id="history-items" class="history-list"></section><section id="history-empty" class="panel empty-state hidden"><div class="placeholder-icon">◷</div><h2>No study materials yet</h2><p>Summaries, quiz results, and flashcard sets you save will appear here.</p><a class="button button-primary" href="/summarizer">Create a study set</a></section>
<div class="modal-backdrop hidden" id="detail-backdrop"><section class="detail-modal" role="dialog" aria-modal="true"><button class="modal-close" id="detail-close" aria-label="Close">×</button><span class="result-kicker" id="detail-type"></span><h2 id="detail-title"></h2><div id="detail-content" class="summary-content"></div></section></div>
{% endblock %}
